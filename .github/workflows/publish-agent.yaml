name: Publish agent

# The agent is the half of tracy that lives inside someone else's service, so it is the half that
# has to be resolvable as an artifact. `:shared` goes with it: `:agent` exposes it through `api`,
# so a consumer who cannot resolve `:shared` cannot use `:agent` either.

# Manual on purpose. Publishing used to fire on every push touching agent/, shared/ or the
# version catalog, which meant a dependency bump cut a release of the agent — and with those
# updates now merging themselves, nobody was even in the room when it happened. Releasing is a
# decision; CI on the pull request is what proves the code builds.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native cache: LLVM and the sysroots weigh hundreds of megabytes and are downloaded
      # once. Without it every run spends minutes on that alone.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Tests first. An artifact that failed its own tests is worse than no artifact: it is
      # available and wrong.
      - name: Check
        run: ./gradlew :shared:check :agent:check --stacktrace

      # REPOSILITE_URL is a repository address rather than a credential, but a public build file
      # is a poor place to publish the location of a private Maven repository — so it arrives from
      # outside too. With it unset the publishing block registers no repository at all.
      - name: Publish
        run: ./gradlew :shared:publishAllPublicationsToWipRepository :agent:publishAllPublicationsToWipRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_BUILD_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_REPOSILITE_URL: ${{ secrets.REPOSILITE_URL }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}

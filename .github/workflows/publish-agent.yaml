name: Publish agent

# The agent is the half of tracy that lives inside someone else's service, so it is the half that
# has to be resolvable as an artifact. `:shared` goes with it: `:agent` exposes it through `api`,
# so a consumer who cannot resolve `:shared` cannot use `:agent` either.

# Manual on purpose. Publishing used to fire on every push touching agent/, shared/ or the
# version catalog, which meant a dependency bump cut a release of the agent — and with those
# updates now merging themselves, nobody was even in the room when it happened. Releasing is a
# decision; CI on the pull request is what proves the code builds.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Java, Gradle and the Kotlin/Native cache in one step. That cache is not an optimisation to
      # taste: LLVM and the sysroots weigh hundreds of megabytes, and without it every run spends
      # minutes downloading them again.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      # Tests first. An artifact that failed its own tests is worse than no artifact: it is
      # available and wrong.
      - name: Check
        run: ./gradlew :shared:check :agent:check --stacktrace

      # `0.2.<run number>`. It reaches the build as the version itself rather than as a part for
      # the build to assemble, because `sborka.base` sets the PROJECT version from it — and a version
      # set on the publication alone ships archives named after something else.
      #
      # The head is also in `gradle.properties`, as the fallback a build with no -PVERSION gets.
      # The two are one number said twice, so they move together.
      - name: Determine version
        id: ver
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # REPOSILITE_URL is gone: `sborka.publish` declares the repository. The address is in the
      # public source of the conventions and in the seven repositories that have migrated, so keeping
      # it in a secret concealed nothing that was still concealed — and with the secret unset, as it
      # was, the publishing block registered no repository at all and the publish did nothing.
      - name: Publish
        run: ./gradlew :shared:publishAllPublicationsToWipRepository :agent:publishAllPublicationsToWipRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}

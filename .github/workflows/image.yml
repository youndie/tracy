name: Image

# CI builds and tests the code; until this job, nothing ever ran the thing that gets deployed. The
# runtime image has no base image at all now — no shell, no `ls`, nothing to `kubectl exec` into —
# so what it does or does not contain cannot be asked; it can only be exercised.
#
# It runs the server far enough to put a record through ingest, SQLite and the query path, because a
# check that stops at a status code passes on an image that cannot encode a string. That is not
# hypothetical: it is what a bare `scratch` image did to katcher, and `iconv` is reached by any path
# that builds a URL (see server/Dockerfile).
#
# Path-filtered because it costs about ten minutes and a change to the agent cannot affect it.
#
# The two lists are the same list written twice: GitHub's workflow parser does not resolve YAML
# anchors, and one that silently expanded to nothing would turn the filter into "never run".

on:
  pull_request:
    paths:
      - server/**
      - shared/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - server/**
      - shared/**
      - dev/image-smoke.sh
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .dockerignore
      - .github/workflows/image.yml

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the runtime image
        run: docker build --file server/Dockerfile --tag tracy:ci .

      - name: The image runs, ingests and reads back
        run: |
          docker run --detach --name tracy-ci --publish 8080:8080 \
            --env TRACY_INGEST_KEY=smoke-key \
            --env TRACY_DB_PATH=/data/tracy.db \
            tracy:ci
          ./dev/image-smoke.sh http://localhost:8080 smoke-key

      # The shutdown is the half of the lifecycle nobody watches, and on Kotlin/Native it is the half
      # that runs its steps in the opposite order from the JVM. A transcript with the stages in the
      # specified order is what says the sequence ran at all — a process that was simply killed at
      # the end of the grace period looks identical from outside.
      - name: It stops in order, and says so
        run: |
          docker stop --timeout 40 tracy-ci
          log=$(docker logs tracy-ci 2>&1)
          for stage in SIGNAL ANNOUNCE DRAIN RELEASE_POOLS EXIT; do
            if ! printf '%s\n' "$log" | grep -q "$stage COMPLETED"; then
              echo "the shutdown transcript has no completed $stage stage" >&2
              printf '%s\n' "$log" | tail -40 >&2
              exit 1
            fi
          done

      # The container has no shell, so this is the only account of what went wrong.
      - name: What it said, if it did not
        if: failure()
        run: docker logs tracy-ci || true

      # WHAT THIS NUMBER IS DEPENDS ON THE HOST, and the field does not say so: with the overlay2
      # driver a GitHub runner has, `.Size` is the unpacked size on disk; with the containerd
      # snapshotter it is the compressed content, which is what a `pull` transfers. The same katcher
      # image measured 27 918 036 one way and 9 569 623 the other.
      - name: Size
        if: always()
        run: docker image inspect tracy:ci --format 'unpacked on this runner {{.Size}} bytes (not pull bytes, see the workflow comment)'

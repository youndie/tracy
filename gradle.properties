#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.ignoreDisabledTargets=true
#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release. CI passes `0.2.<run number>` as ORG_GRADLE_PROJECT_VERSION.
#
# THE HEAD IS WRITTEN TWICE — here and in `publish-agent.yaml`. Both move together, or a publish
# falls back to the snapshot default and puts it on the server beside the numbered releases.
version=0.2.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.tracy
sborka.repository=youndie/tracy
sborka.description=A logger for agents: structured spans and logs, with a Kotlin/Native server and a multiplatform agent.
sborka.inceptionYear=2026

# 25 for both. Nothing here is consumed by anything older — the agent is used by services in this
# same portfolio, all of which run on 25 — and the floor has to be said out loud either way, or a
# consumer resolves the library, compiles against it and meets UnsupportedClassVersionError at class
# loading, with a message naming a bytecode version rather than this library.
sborka.jvmToolchain=25
sborka.jvmFloor=25

#tracy
# Tag of the server image in ghcr. Deliberately not `VERSION`: that one feeds `libVersion()`, and
# setting it would pin the agent's artifacts instead of letting BUILD_NUMBER move them.
# Bumping this means bumping `server.version` in the chart values too — different repositories,
# one number.
SERVER_VERSION=0.2.2

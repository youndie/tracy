{{- if not .Values.hostname }}
{{- fail "hostname is required: an empty value renders Host(``) rules that match nothing, and the MCP transport would refuse every request as an unexpected Host. Both failures are silent." }}
{{- end }}
{{- if not .Values.ingest.key }}
{{- fail "ingest.key is required: the server refuses to start without TRACY_INGEST_KEY, so an empty value would deploy a pod that crash-loops. Pass it at deploy time from a CI secret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: tracy-keys
  namespace: {{ .Release.Namespace }}
  labels:
    app: tracy-server
type: Opaque
stringData:
  ingest: {{ .Values.ingest.key | quote }}
  {{- if .Values.mcp.token }}
  # Present only when configured. No token means no key here, no env var in the pod, no MCP
  # endpoint mounted and no ingress bypass: absence of configuration yields a closed state.
  mcp: {{ .Values.mcp.token | quote }}
  {{- end }}

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Services posting batches are machines holding no browser session: the forward-auth middleware
# would reject them before tracy ever saw the request. This route bypasses it for `/ingest`
# only, and the endpoint authenticates itself with `X-Tracy-Key` instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tracy-ingest-bypass
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`) && Path(`/ingest`) && Method(`POST`)
      kind: Rule
      services:
        - name: tracy-server
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- if .Values.mcp.token }}
---
# Same argument for MCP clients, and the same guard: rendered only when a token is configured,
# so a bypass cannot come into existence without the authentication that replaces it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tracy-mcp-bypass
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: tracy-server
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tracy-main
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.hostname }}`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: tracy-server
          port: 8080
      priority: 1
    # Everything not matched above — `/api/**` and `/health` — goes through forward-auth. tracy
    # has no login of its own and trusts the proxy's headers, which is exactly why it must never
    # be reachable without one (docs/api/endpoint-query.md).
    - match: Host(`{{ .Values.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.traefik.authMiddleware.name }}
      {{- range .Values.traefik.middlewares }}
        - name: {{ .name }}
      {{- end }}
      services:
        - name: tracy-server
          port: 8080
      priority: 10
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracy-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: tracy-server
spec:
  replicas: 1
  # One writer, one volume. `Recreate` rather than the default rolling update: two pods would
  # both open the same SQLite file, and WAL across two processes on a network volume is how a
  # database gets corrupted rather than how it stays available.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracy-server
  template:
    metadata:
      labels:
        app: tracy-server
    spec:
      # THE NUMBER THE SHUTDOWN PLAN IS CHECKED AGAINST. `DEADLINES` in the server's `Application.kt`
      # adds up to 21 seconds and declares 30 as the budget it fits into; nothing tells a process
      # its real grace period on any platform, so the two are one number written in two places and
      # they move together. Lower this and the process is SIGKILLed mid-drain, with kore's fit
      # check saying nothing, because it was told 30.
      terminationGracePeriodSeconds: 30
      containers:
        - name: tracy-server
          image: "{{ .Values.registry.server }}/{{ .Values.registry.org }}/{{ .Values.server.image }}:{{ .Values.server.version }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRACY_DB_PATH
              value: {{ .Values.db.path }}/{{ .Values.db.name }}
            - name: TRACY_DB_MAX_BYTES
              # `int64` before `quote`, and it is not decoration. Helm parses a plain YAML number
              # into a float, so `quote` alone renders 6442450944 as "6.442450944e+09" — which the
              # server cannot parse, and which it used to answer by silently taking its own default
              # of 4 GiB. The stand ran six weeks on a cap nobody had set.
              value: {{ .Values.db.maxBytes | int64 | quote }}
            - name: TRACY_RETENTION_DAYS
              value: {{ .Values.retention.days | int64 | quote }}
            - name: TRACY_RETENTION_COUNTS_DAYS
              value: {{ .Values.retention.countsDays | int64 | quote }}
            # From the Secret, not inlined: an inlined value shows up in
            # `kubectl get deployment -o yaml` and in Helm release history.
            - name: TRACY_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: tracy-keys
                  key: ingest
            {{- if .Values.selfService }}
            - name: TRACY_SELF_SERVICE
              value: {{ .Values.selfService | quote }}
            {{- end }}
            {{- if .Values.mcp.token }}
            - name: TRACY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tracy-keys
                  key: mcp
            # The transport refuses any Host it was not told about and defaults to localhost, so
            # the public hostname has to be declared or every request is rejected. This failure
            # cannot be reproduced on a developer machine, where the host always is localhost.
            - name: TRACY_MCP_ALLOWED_HOSTS
              value: {{ .Values.hostname | quote }}
            {{- end }}
          # THREE PROBES, THREE QUESTIONS. Both of these used to point at `/health`, which made the
          # readiness probe one that cannot fail while the process is alive: a tracy that had lost
          # its database stayed in the Service and went on being sent batches, and the only thing
          # that could take it out was the liveness probe restarting it — the heaviest possible
          # answer to a store problem.
          #
          # Retention state has not gone anywhere; it moved to `/health/retention`, which is a
          # report rather than a probe. It is deliberately not a readiness check either: a tracy
          # that cannot evict can still answer queries, and taking the only instance out of service
          # over a full disk is an outage of the thing you read to diagnose the full disk.
          #
          # `failureThreshold: 60` with `periodSeconds: 1` rather than a long `initialDelaySeconds`:
          # the pod enters service as soon as it is ready instead of at a fixed time chosen for the
          # worst case. Migrations run before the engine serves, so the minute is for them.
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            # Generous on purpose: a slow reply here means the single writer is busy, and
            # restarting the process mid-write is worse than waiting for it.
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.server.resources.requests.cpu | quote }}
              memory: {{ .Values.server.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.server.resources.limits.cpu | quote }}
              memory: {{ .Values.server.resources.limits.memory | quote }}
          volumeMounts:
            - name: sqlite-data
              mountPath: {{ .Values.db.path }}
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: tracy-data

# The image is public on ghcr, like katcher's and metrik's, so there is no pull secret here
# and none is needed.
registry:
  server: ghcr.io
  org: youndie

# The public hostname. Required: the MCP transport refuses any Host it was not told about,
# and the ingress rules match on it.
hostname: ""

server:
  image: tracy
  # 0.3.0 AND NOT EARLIER: the chart above probes `/health/startup`, and an image without that
  # route fails the startup probe sixty times and is restarted. The chart and the image move
  # together or the install is a CrashLoop behind a healthy-looking deployment.
  version: 0.3.0
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "1"
      # SQLite here is not a client of a database server — it *is* the database, and the page cache
      # lives in this process.
      #
      # 256Mi STAYS, AND WHAT CHANGED IS THE REASON (M-137). The earlier note here said the resident
      # set grows with what has been written. It does not: under a *fixed* ingest rate — 500 records
      # a second on an isolated two-core box, `--cpus=1`, a read in every tenth request — the stock
      # 0.3.0 was OOM-killed at 65 minutes, and the thing that grew was the write-ahead log, to
      # 931 MB, while the database file stopped at 187 MB. SQLite's automatic checkpoint is PASSIVE:
      # it cannot reset the log while any reader is active, and tracy is read while it is written.
      # A log that big makes reads slow, slow reads mean more requests in flight at a rate that does
      # not back off, more requests mean more threads, and every thread costs a malloc arena. That
      # is the whole of the resident set: ten anonymous mappings of 6–12 MB in `smaps`.
      #
      # Which is why the number that matters most is not this limit but the size of the SQLite pool
      # — `TRACY_DB_MAX_CONNECTIONS`, which the server defaults to 2 and this chart deliberately
      # does not repeat, because a number in two places drifts in one of them. At
      # ten connections the process is killed under 256Mi *and* under 128Mi; at two it ran past
      # twice the death point on a database twice the size, with a third of the memory. The sweep in
      # the server (`TRACY_WAL_CHECKPOINT_SECONDS`, `TRACY_WAL_MAX_BYTES`) is necessary and on its
      # own not sufficient — measured, both ways round.
      #
      # The image also carries `MALLOC_ARENA_MAX=2` (see server/Dockerfile): glibc counts the host's
      # cores rather than the container's quota when it decides how many malloc arenas a process may
      # grow, and the resident set is the sum of their high-water marks. Measured at 33 % less
      # anonymous memory for the same bytes ingested.
      #
      # 128Mi is NOT enough for the load that was measured: with ten connections it dies at 11–13
      # minutes, and what decides it is the working set, not the ingest rate — under that limit the
      # page cache covers the database only up to about 60 MB.
      memory: "256Mi"

# Ingest key for `POST /ingest`. The server refuses to start without one, so unlike the MCP
# token this is not optional — an empty value fails the deploy rather than opening the endpoint.
# Supply it at deploy time (--set ingest.key=...) from a CI secret; never commit a value.
ingest:
  key: ""

# Bearer token for the MCP endpoint. Empty means the endpoint is not mounted, the Secret is not
# created, and the ingress bypass is not rendered: the feature is off, not open.
mcp:
  token: ""

db:
  size: 8Gi
  class: "local-path"
  path: /data
  name: tracy.db
  # The server evicts oldest-day-first when the file passes this. Kept below the volume size on
  # purpose: a full volume is a write failure, an exceeded budget is a planned drop.
  maxBytes: 6442450944

retention:
  # Bodies are dropped after this many days...
  days: 30
  # ...counters are kept longer, because they are what "is this new?" is answered from and they
  # cost a row per template per service per day rather than a row per record.
  countsDays: 90

# Self-observation: tracy's own logs go to tracy, over the real ingest path rather than an
# in-process shortcut. Empty disables it. See research 1.5 — a localhost endpoint needs no name
# resolution, so this does NOT exercise what M-29 covers.
selfService: ""

traefik:
  certResolver: cloudflare
  authMiddleware:
    name: ""
    namespace: ""
  middlewares: []
